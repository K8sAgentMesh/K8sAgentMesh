# Tag-driven release: build+push images to ghcr.io/K8sAgentMesh/* and ship
# the helm chart with version=appVersion=repo tag (ISI-6158 C3, decision D3:
# independent versioning, decoupled from any host project's releases).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: image ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: mesh-gateway
            dockerfile: images/Dockerfile.mesh-gateway
          - name: agentruntime
            dockerfile: images/Dockerfile.agentruntime
          - name: toolchain-vibe
            dockerfile: images/Dockerfile.toolchain-vibe
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve chart-matching tag (the chart stamps appVersion v-stripped)
        id: vtag
        run: |
          echo "app_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # GHCR namespaces are lowercase; docker rejects uppercase repository names.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.vtag.outputs.owner }}/${{ matrix.image.name }}:${{ steps.vtag.outputs.app_tag }}
            ghcr.io/${{ steps.vtag.outputs.owner }}/${{ matrix.image.name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.vtag.outputs.owner }}/${{ matrix.image.name }}:latest
            ghcr.io/${{ steps.vtag.outputs.owner }}/${{ matrix.image.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stamp chart version = appVersion = repo tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: ${tag}/" deploy/helm/k8sagentmesh/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${tag}\"/" deploy/helm/k8sagentmesh/Chart.yaml
          cat deploy/helm/k8sagentmesh/Chart.yaml
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Package
        run: |
          mkdir -p dist
          helm package deploy/helm/k8sagentmesh -d dist
          ls -l dist
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --json url >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "K8sAgentMesh ${GITHUB_REF_NAME}: images on ghcr.io/${GITHUB_REPOSITORY_OWNER}/*, chart version=appVersion=${GITHUB_REF_NAME#v}."
          gh release upload "${GITHUB_REF_NAME}" dist/*.tgz --clobber
