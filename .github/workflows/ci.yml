name: ci
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify module
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1
      - name: Extraction-clean guard (ISI-5827 P3 seam)
        run: hack/extraction-clean.sh
      - name: CRD structural-schema validation (ISI-6086 P3.8)
        run: hack/crd-structural-validate.sh
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted" && exit 1
          fi
