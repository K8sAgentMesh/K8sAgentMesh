name: ci

# Multi-job PR pipeline (ISI-6101, plan from ISI-6095 rev 82afbd79).
#
# Required jobs: build, unit, quality, guards, coverage, dco, security-code,
# security-deps, sbom-cve (branch-protection set). `docker` is active and
# hardened (multi-arch + provenance/SBOM + built-image CVE gate + GHCR publish,
# ISI-6212) — ready to promote to the required set (see
# docs/ci-branch-protection.md).
# `images` builds every images/ Dockerfile on every PR (ISI-6217 build
# gate — the toolchain pins must resolve or the check fails).
# Self-activating stubs: helm, functional — gated on the `detect` job's
# outputs. `hashFiles()` cannot be used reliably in a job-level `if` (the
# workspace is empty before checkout, see
# github.com/orgs/community/discussions/25790), so detection runs once in
# `detect` and the stubs gate on its outputs. They skip cleanly today and
# activate as soon as the matching Phase 2 artifact lands. `docker` uses the
# same `detect` gate and is now active because the root Dockerfile is present.
# Informational: performance (passes while no benchmarks exist).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect optional repo artifacts (docker / helm / integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      docker: ${{ steps.gates.outputs.docker }}
      helm: ${{ steps.gates.outputs.helm }}
      functional: ${{ steps.gates.outputs.functional }}
    steps:
      - uses: actions/checkout@v7
      - name: Evaluate artifact gates
        id: gates
        run: |
          set -euo pipefail
          docker=false
          helm=false
          functional=false
          if compgen -G 'Dockerfile*' >/dev/null; then docker=true; fi
          if [ -n "$(find . -path ./.git -prune -o -name Chart.yaml -print | head -n1)" ]; then helm=true; fi
          if [ -n "$(find test/integration -type f -print -quit 2>/dev/null)" ]; then functional=true; fi
          {
            echo "docker=$docker"
            echo "helm=$helm"
            echo "functional=$functional"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build + vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go build ./...
        run: go build ./...
      - name: go vet ./...
        run: go vet ./...

  unit:
    name: Unit tests (race detector)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: go test -race
        # -race matters: gateway/childproc/sweeper goroutines.
        # -count=1 bypasses the local test cache; the full-suite rerun is
        # the regression net.
        run: go test ./... -race -count=1

  quality:
    name: Lint + gofmt + module hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted" && exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: go mod tidy (zero-dependency guard)
        # -diff prints the would-be diff and exits nonzero without touching
        # go.mod/go.sum, so the zero-dep posture stays enforced.
        run: |
          if ! go mod tidy -diff; then
            echo "::error::'go mod tidy' would change go.mod/go.sum — commit the tidied module files."
            exit 1
          fi

  guards:
    name: Extraction-clean + CRD structural guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Extraction-clean guard (ISI-5827 P3 seam)
        run: hack/extraction-clean.sh
      - name: CRD structural-schema validation (ISI-6086 P3.8)
        run: hack/crd-structural-validate.sh

  coverage:
    name: "Coverage (soft gate: warn <70%, fail <50%)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Run tests with coverage
        # go test prints the per-package coverage summary in the log.
        run: go test ./... -count=1 -coverprofile=coverage.out | tee coverage-summary.txt
      - name: Total coverage soft gate
        run: |
          set -euo pipefail
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')"
          echo "Total coverage: ${total}%"
          if awk -v c="$total" 'BEGIN {exit !(c < 50)}'; then
            echo "::error::Coverage ${total}% is below the 50% floor."
            exit 1
          fi
          if awk -v c="$total" 'BEGIN {exit !(c < 70)}'; then
            echo "::warning::Coverage ${total}% is below the 70% target (soft gate)."
          fi
      - name: Render HTML report
        run: go tool cover -html=coverage.out -o coverage.html
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
            coverage-summary.txt

  dco:
    name: DCO (Signed-off-by on every PR commit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify DCO sign-offs on PR commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bad="$(gh pr view "$PR_NUMBER" --repo "$PR_REPOSITORY" --json commits \
            --jq '[.commits[]
              | select((([.messageHeadline, .messageBody] | join("\n"))
                  | split("\n")
                  | map(test("^Signed-off-by: .*<.+@.+>"))
                  | any) | not)
              | {sha: .oid, subject: .messageHeadline}]')"
          if [ "$bad" != "[]" ]; then
            echo "::error::DCO violation — these PR commits lack a 'Signed-off-by:' trailer:"
            echo "$bad" | jq -r '.[] | "  \(.sha)  \(.subject)"'
            echo "Sign the commits (e.g. 'git rebase --signoff') and push again."
            exit 1
          fi
          echo "OK: every PR commit carries a Signed-off-by trailer."

  security-code:
    name: govulncheck + CodeQL (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # actions: read is required by the CodeQL action's status-report
      # step (GET /actions/workflow-runs) — without it the analyze step
      # fails with "Resource not accessible by integration".
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: govulncheck
        # Exits nonzero when vulnerable symbol calls are reachable.
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-file: go.mod
          go-package: ./...
          cache: false
      # CodeQL upload requires GitHub Advanced Security (code scanning) on
      # this private repo; it is currently disabled and the analyze step
      # fails with "Advanced Security must be enabled". Probe first so the
      # strict CodeQL analysis self-activates the moment a repo admin
      # enables Settings -> Code security -> Advanced Security, while
      # govulncheck keeps enforcing reachable-vuln checks meanwhile.
      - name: Probe code scanning availability (GHAS)
        id: ghas
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "/repos/$PR_REPOSITORY/code-scanning/analyses" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Code scanning reachable — running CodeQL analysis strictly."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CodeQL deferred: GitHub Advanced Security / code scanning is not enabled on this repository. A repo admin must enable it under Settings -> Code security (see docs/ci-branch-protection.md). govulncheck still runs on every PR; CodeQL auto-activates once the feature is on."
          fi
      - name: CodeQL init
        if: steps.ghas.outputs.available == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: go
      - name: CodeQL autobuild
        if: steps.ghas.outputs.available == 'true'
        uses: github/codeql-action/autobuild@v4
      - name: CodeQL analyze
        if: steps.ghas.outputs.available == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:go

  security-deps:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      # dependency-review requires the dependency graph (+ GHAS) on private
      # repos; both are currently disabled here (probed 2026-10-18: the
      # dependency-graph/sbom endpoint returns 404). Probe first so the
      # required check self-activates the moment a repo admin enables
      # Settings -> Code security -> Dependency graph + Advanced Security,
      # instead of hard-failing every PR in the meantime.
      - name: Probe dependency-review availability
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "/repos/$PR_REPOSITORY/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Dependency graph reachable — running dependency review strictly."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::dependency-review deferred: the dependency graph / GitHub Advanced Security is not enabled on this repository. A repo admin must enable it under Settings -> Code security (see docs/ci-branch-protection.md). This check auto-activates once the feature is on."
          fi
      - name: Dependency review
        if: steps.probe.outputs.available == 'true'
        uses: actions/dependency-review-action@v5

  sbom-cve:
    name: SBOM (Syft) + CVE scan (Grype, fail on critical)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Syft SBOM — SPDX
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom-spdx.json
      - name: Syft SBOM — CycloneDX
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom-cyclonedx.json
      - name: Grype CVE scan — source/dependency tree (fails on Critical)
        # Source + Go-dependency CVE gate (this required check). The
        # complementary *built-image* gate (base layers + binary) lives in the
        # `docker` job (ISI-6212), which scans the loaded amd64 image.
        # severity-cutoff: critical — High and below are reported but do not
        # fail (accepted CVE policy).
        uses: anchore/scan-action@v7
        with:
          path: .
          fail-build: true
          severity-cutoff: critical
          output-format: table

  performance:
    name: Benchmarks (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Run benchmarks
        run: go test ./... -run='^$' -bench=. -benchmem -count=1 | tee bench.txt
      - name: Count benchmark results
        id: bench
        run: |
          count="$(grep -c '^Benchmark' bench.txt || true)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Benchmark result lines: $count"
      # Informational only. benchmark-action@v1 ALWAYS runs `git switch gh-pages`
      # to store results unless they are kept outside gh-pages — skip-fetch-gh-pages
      # only skips the fetch, not the switch, so it still died with
      # "invalid reference: gh-pages" (exit 128). Point it at a local JSON file
      # (external-data-json-path) so no baseline branch is ever touched, and
      # render the table into the job summary (summary-always) which needs no
      # extra token scope. continue-on-error keeps this non-required informational
      # job from ever blocking a PR. (`fail-on-error` is NOT a valid input for
      # this action — it was silently ignored.) Graduating to a real comparison
      # gate (seed gh-pages + auto-push) is ISI-6106 Phase 2.
      - name: Process benchmark results (informational)
        if: github.event_name == 'pull_request' && steps.bench.outputs.count != '0'
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: go
          output-file-path: bench.txt
          github-token: ${{ github.token }}
          external-data-json-path: ./cache/benchmark-data.json
          summary-always: true
          auto-push: false
      - name: No benchmarks yet
        if: steps.bench.outputs.count == '0'
        run: echo "No benchmarks defined yet — performance job passes informationally."

  docker:
    name: Docker build (multi-arch, scan, conditional GHCR push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect
    if: needs.detect.outputs.docker == 'true'
    permissions:
      contents: read
      # Needed only for the GHCR push on main/release. PRs are build-only and
      # never authenticate, so the token's write scope is unused on PR runs.
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # amd64 image loaded into the local daemon purely so Grype can scan the
      # *built image* (base layers + binary), not the source tree. load: true
      # is single-platform only; the multi-arch build is a separate step below
      # and reuses these cached layers (same gha scope).
      - name: Build amd64 image for scanning (load)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: k8sagentmesh:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Grype CVE scan of built image (fails on Critical)
        # The authoritative image-layer CVE gate (base image + binary). The
        # sbom-cve job keeps the source/dependency-tree gate. severity-cutoff:
        # critical — High and below are reported but do not fail.
        uses: anchore/scan-action@v7
        with:
          image: k8sagentmesh:ci
          fail-build: true
          severity-cutoff: critical
          output-format: table

      # Tags + OCI labels for the GHCR publish. metadata-action lowercases the
      # image path, so the mixed-case org resolves to ghcr.io/k8sagentmesh/...
      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/k8sagentmesh
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Log in to GHCR (main/release only)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch build with SLSA provenance + SBOM attestation. push is true
      # only off-PR (push to main / release); PR runs build both arches but do
      # not push and carry no credentials — attestations are generated but,
      # with no push target, simply not stored.
      - name: Build multi-arch image (push on main/release)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  images:
    name: Images build gate (images/*)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect
    if: needs.detect.outputs.docker == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: mesh-gateway
            dockerfile: images/Dockerfile.mesh-gateway
          - name: agentruntime
            dockerfile: images/Dockerfile.agentruntime
          - name: toolchain-vibe
            dockerfile: images/Dockerfile.toolchain-vibe
          - name: toolchain-codex
            dockerfile: images/Dockerfile.toolchain-codex
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # ISI-6217: every images/ Dockerfile must BUILD on every PR — the
      # toolchain-vibe pin (vibe==0.3.0) was unbuildable from birth and
      # nothing caught it because only the root Dockerfile was exercised.
      # The toolchain Dockerfiles' smoke RUN lines additionally prove the
      # pinned CLIs answer --version before the layer is cached.
      - name: Build image (load, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          load: true
          platforms: linux/amd64
          tags: k8sagentmesh-${{ matrix.image.name }}:ci
          cache-from: type=gha,scope=images-${{ matrix.image.name }}
          cache-to: type=gha,scope=images-${{ matrix.image.name }},mode=max

  helm:
    name: Helm lint + ct lint/install + kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect
    if: needs.detect.outputs.helm == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so chart-testing can diff charts against the target branch.
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - name: helm lint
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -name Chart.yaml -print | while read -r ch; do
            helm lint "$(dirname "$ch")"
          done
      - uses: helm/chart-testing-action@v2
      - name: ct lint
        # ct discovers charts exactly one level below each --chart-dirs
        # entry and rejects "./"-prefixed or "." dirs, so map every
        # Chart.yaml in the repo to its normalized parent directory
        # (a plain --chart-dirs . would lint nothing).
        run: |
          set -euo pipefail
          dirs=$(find . -path ./.git -prune -o -name Chart.yaml -print \
            | while read -r ch; do dirname "$(dirname "$ch")"; done \
            | sed 's|^\./||' | sort -u)
          for d in $dirs; do
            ct lint --all --chart-dirs "$d" --validate-maintainers=false
          done
      - uses: helm/kind-action@v1
      - name: ct install (kind)
        # Installs every chart on the kind cluster above. ct automatically
        # picks up each chart's ci/ct-values.yaml (pause-image smoke override
        # so PR runs don't depend on the release tag cadence, ISI-6211).
        # --validate-maintainers is a ct lint-only flag.
        run: |
          set -euo pipefail
          dirs=$(find . -path ./.git -prune -o -name Chart.yaml -print \
            | while read -r ch; do dirname "$(dirname "$ch")"; done \
            | sed 's|^\./||' | sort -u)
          for d in $dirs; do
            ct install --all --chart-dirs "$d"
          done
      - name: kubeconform with repo CRDs
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          find . -path ./.git -prune -o -name Chart.yaml -print | while read -r ch; do
            dir="$(dirname "$ch")"
            echo "kubeconform: $dir"
            helm template "$dir" | ./kubeconform -strict -summary \
              -ignore-missing-schemas \
              -schema-location 'default' \
              -schema-location 'file://apis/mesh/v1alpha1/crd'
          done

  functional:
    name: Integration tests (envtest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect
    if: needs.detect.outputs.functional == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: envtest-backed integration tests
        # Once test/integration/ holds *_test.go files (Phase 2), this runs
        # them; the envtest bootstrap (setup-envtest, KUBEBUILDER_ASSETS)
        # is wired together with those tests.
        run: |
          set -euo pipefail
          if [ -n "$(find test/integration -name '*_test.go' -print -quit 2>/dev/null)" ]; then
            go test ./test/integration/... -count=1
          else
            echo "test/integration/ exists but has no *_test.go yet — informational pass."
          fi
