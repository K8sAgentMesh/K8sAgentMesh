{{- if and .Values.agentruntime.enabled .Values.agentruntime.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8sagentmesh.fullname" . }}-agentruntime
  labels:
    {{- include "k8sagentmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: agentruntime
spec:
  type: {{ .Values.agentruntime.service.type }}
  ports:
    - name: http
      port: {{ .Values.agentruntime.service.port }}
      targetPort: http
  selector:
    {{- include "k8sagentmesh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agentruntime
{{- end }}
