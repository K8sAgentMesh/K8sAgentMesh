# MeshTelemetry — the mesh-owned telemetry emission CRD contract (P3.8,
# the P3.8 CRD contract). Shapes derive from the P3.6 lifecycle-event contract
# (mesh.LifecycleObserver: route|spawn|wake — deliberately no hibernate
# hook; hibernation rides the process-state gauge). Emitter ships none|otel
# only per the board design review — the NATS
# emitter is deferred until the event schema proves out. This CRD does NOT
# duplicate a host's OtelConfig spine. No controller ships with the module.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: meshtelemetries.mesh.k8sagentmesh.io
  labels:
    app.kubernetes.io/part-of: k8sagentmesh
spec:
  group: mesh.k8sagentmesh.io
  names:
    plural: meshtelemetries
    singular: meshtelemetry
    kind: MeshTelemetry
    listKind: MeshTelemetryList
    shortNames:
      - mtelemetry
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Emitter
          type: string
          jsonPath: .spec.emitter
        - name: Namespace
          type: string
          jsonPath: .spec.namespace
        - name: Events
          type: string
          jsonPath: .spec.events
      schema:
        openAPIV3Schema:
          type: object
          description: MeshTelemetry is the declarative on/off + sink selector over the P3.6 lifecycle-event contract. It references the host's OTel spine's existence, never its fields.
          required: ["spec"]
          properties:
            apiVersion:
              type: string
              description: APIVersion defines the versioned schema (mesh.k8sagentmesh.io/v1alpha1).
            kind:
              type: string
              description: Kind is the REST resource (MeshTelemetry).
            metadata:
              type: object
              properties:
                name:
                  type: string
            spec:
              type: object
              properties:
                scope:
                  type: object
                  description: Scope of the emission posture; absent means cluster-wide.
                  properties:
                    team:
                      type: string
                      description: Team whose pools this object scopes.
                    role:
                      type: string
                      description: Role scope; empty matches every role of the team.
                emitter:
                  type: string
                  description: '"none": no observer wired, events dropped. "otel": the host''s OTel spine impl. "nats" is reserved for the deferred implementation #2 and rejected until it ships.'
                  enum: ["none", "otel"]
                namespace:
                  type: string
                  description: 'Metric prefix (today''s host impl: "ksquad" → ksquad.mesh.*); empty uses the emitter''s default.'
                events:
                  type: array
                  description: Per-event on/off subset of the P3.6 hook set (route|spawn|wake). Empty means all events on; a subset turns the unlisted hooks off.
                  items:
                    type: string
                    enum: ["route", "spawn", "wake"]
                  maxItems: 3
                  x-kubernetes-list-type: set
                otel:
                  type: object
                  description: OTel emission channel toggles; consumed only when emitter is "otel". Absent keeps both channels on.
                  properties:
                    spans:
                      type: boolean
                      description: mesh.route/mesh.spawn/mesh.wake spans on/off; absent behaves as true.
                    metrics:
                      type: boolean
                      description: namespace.* metric set on/off; absent behaves as true.
            status:
              type: object
              description: Bounded emission read-back.
              properties:
                emittedTotal:
                  type: integer
                  format: int64
                  description: Count of emitted events across the enabled hook set.
                lastEmitAt:
                  type: string
                  format: date-time
                  description: RFC 3339 timestamp of the most recent emit.
