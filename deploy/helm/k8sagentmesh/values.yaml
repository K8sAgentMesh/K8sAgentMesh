# Default values for the vanilla k8sagentmesh chart (ISI-6158 C3;
# ingest surface + toolchain PATH closed in ISI-6217).

# -- Global image settings. Tags left empty default to the chart's
# appVersion (the repo tag the release workflow stamps).
global:
  image:
    registry: ghcr.io/k8sagentmesh
    pullPolicy: IfNotPresent

# -- Standing-process gateway (cmd/meshgw, HTTP /task entrypoint) launching
# the mesh-owned standing supervisor (cmd/mesh-supervisor) per band slot.
gateway:
  enabled: true
  replicaCount: 1
  image:
    repository: mesh-gateway
    tag: ""        # defaults to .Chart.AppVersion
  runtimeType: vibe
  model: ""        # optional envelope model override
  pool:
    min: 1
    max: 1
  # -- Toolchain layer for the standing band: the gateway pod hosts the
  # band, so the pinned CLI substrate (vibe or codex) is copied onto the
  # pod by an initContainer and prepended to PATH (ISI-6217 gaps 1+4).
  toolchain:
    enabled: true
    image:
      repository: ""   # defaults by runtimeType: toolchain-vibe | toolchain-codex
      tag: ""          # defaults to .Chart.AppVersion
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
    port: 8080

# -- Per-task agentruntime supervisor (cmd/mesh-supervisor behind a Service:
# the deployed task-ingest surface; cmd/agentruntime stays shipped for
# one-shot stdio lanes).
agentruntime:
  enabled: true
  replicaCount: 1
  image:
    repository: agentruntime
    tag: ""        # defaults to .Chart.AppVersion
  runtimeType: vibe
  model: ""        # optional VIBE_ACTIVE_MODEL pin override
  # -- Supervisor entrypoint the deployed pod runs (default: the standing
  # HTTP supervisor — the task-ingest surface). Test lanes swapping in a
  # stand-in image (see ci/ct-values.yaml) override this.
  command: ["/usr/local/bin/mesh-supervisor"]
  # -- BYO OpenAI-compatible model route. This is the recommended way to
  # point the mesh at a model: set `endpoint` to any OpenAI-compatible
  # `/v1` base URL and supply the key via `credentials.existingSecret`
  # (below). Empty `endpoint` (the default) leaves the runtime on its
  # native default (Mistral for vibe via MISTRAL_API_KEY, OpenAI for
  # codex via OPENAI_API_KEY). Provider examples:
  #   OpenAI            endpoint: https://api.openai.com/v1
  #                     (OPENAI_API_KEY via credentials.existingSecret)
  #   Anthropic         via an OpenAI-compatible proxy (e.g. LiteLLM):
  #                     endpoint: http://litellm.llm.svc:4000/v1
  #                     (the proxy holds the Anthropic key; the mesh speaks
  #                      only the OpenAI wire — there is no direct Anthropic
  #                      route, the proxy hop is required)
  #   Ollama (external) endpoint: http://<your-ollama-host>:11434/v1
  #   Ollama (in-cluster) optional LOCAL DEMO only — slow, not for
  #                     production; the chart ships none (bring your own),
  #                     and the CI live-validation lane's in-cluster Ollama
  #                     is a test-only zero-credential convenience.
  modelRoute:
    endpoint: ""   # OpenAI-compatible /v1 base URL; empty = runtime default
    model: ""      # model id at that endpoint (e.g. gpt-4o-mini, qwen2.5)
  # -- Task-ingest Service fronting the supervisor's POST /task NDJSON
  # surface (ISI-6217 gap 2).
  service:
    type: ClusterIP
    port: 8080
  # -- Toolchain layer: the pinned CLI substrate image copied onto the
  # supervisor's PATH by an initContainer (see images/README.md).
  toolchain:
    enabled: true
    image:
      repository: ""   # defaults by runtimeType: toolchain-vibe | toolchain-codex
      tag: ""          # defaults to .Chart.AppVersion
  # -- Credential seam: reference an existing Secret; the key is projected
  # into the runtime-native env var (MISTRAL_API_KEY for vibe,
  # OPENAI_API_KEY for codex and goose). Never set raw credentials here.
  credentials:
    existingSecret: ""        # e.g. mesh-vibe-credentials
    mistralApiKeyKey: mistral-api-key
    openaiApiKeyKey: openai-api-key
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

rbac:
  # -- Create ServiceAccount + ClusterRole/Binding for the mesh CRDs.
  create: true
  serviceAccount:
    create: true
    name: ""

# -- Extra pod env (name/value pairs) applied to both Deployments.
extraEnv: []
