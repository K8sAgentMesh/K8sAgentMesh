# chart-testing (`ct install`) override values.
#
# The real application images (ghcr.io/k8sagentmesh/{mesh-gateway,agentruntime,
# toolchain-vibe,toolchain-codex}) publish on release tags; PR-time `ct
# install` on kind cannot assume the appVersion tag exists yet, which would
# turn the Helm CI job red on every PR.
#
# chart-testing uses this file INSTEAD of the default values.yaml when it
# installs the chart on kind, so we swap in a public, always-running image
# (registry.k8s.io/pause) for the gateway + agentruntime workloads. The
# deployments declare no readiness/liveness probes, so a Running pause pod
# satisfies `helm install --wait` — proving the chart renders and applies on
# a real kind cluster (ISI-6211 item 1: vanilla install, zero k8squad)
# without depending on the release cadence.
#
# This file is test-only: real installs never read ci/, so chart behaviour
# is unchanged. A release-validated run can pin the real tags here instead.
global:
  image:
    registry: registry.k8s.io
    pullPolicy: IfNotPresent

gateway:
  image:
    repository: pause
    tag: "3.9"
  # The pause image has no shell, so the toolchain-layering initContainer
  # (and the PATH amendment that rides it) is disabled for the install
  # smoke. The CLI-layering path is exercised by the real toolchain images
  # once pulled from GHCR.
  toolchain:
    enabled: false

agentruntime:
  image:
    repository: pause
    tag: "3.9"
  # The pause image carries no mesh-supervisor binary; run its own
  # entrypoint for the install smoke (the real command is exercised by the
  # released agentruntime image).
  command: ["/pause"]
  toolchain:
    enabled: false
